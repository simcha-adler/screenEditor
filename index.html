<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עורך תוכן (דמוי אתר) - עם פאנלי עיצוב</title>
    <link rel="stylesheet" href="style.css">
    <script src="./lib/short.js"></script>
    <!--script src="./load.js"></script-->
</head>

<body>

    <div id="main-nav" class="main-nav"></div>


    <div id="toolbar" class="toolbar"></div>


    <div class="main-area">

        <div class="editor-container">
            <div id="דף הבסיס" class="document-page" contenteditable="true" spellcheck="false">
                <h1 id="כותרת לדוגמא">כותרת האתר/מסמך שלך</h1>
                <p id="פסקה לדוגמא 1">כעת תפריט "עיצוב" פותח הגדרות מתקדמות בסרגל הצד.</p>
                <hr>
                <p id="פסקה לדוגמא 2">נסו לבחור טקסט ולפתוח את פאנל "צבעים וגופנים" בתפריט עיצוב.</p>
            </div>
        </div>

        <div id="sidebarLeft" class="sidebar-left-complex">

            <div
                style="display: flex; justify-content: left; align-items: center; padding-bottom: 5px; margin-bottom: 10px;">
                <!--h3>סרגל צד (הגדרות)</h3-->
                <div class="" id="selectedElement">
                    <label for="selectedElement">
                        <span>האלמנט הנבחר</span>
                        <input type="text" name="theElement" id="theElement" placeholder="">
                    </label>
                </div>
                <div class="" id="edit-to-state">
                    <label for="edit-to-state">
                        <span>עריכה למצב:</span>
                        <select name="dropdown-states" id="dropdown-states">
                            <option value="">בסיסי</option>
                            <option value="hover">מעבר עכבר</option>
                            <option value="focus">מיקוד</option>
                        </select>
                    </label>
                </div>
                <button id="toggleTree" style="background: #f5f5f5; font-size: larger; border: none; cursor: pointer;"
                    title="פתח עץ אלמנטים">
                    &#127795;
                </button>
            </div>

            <div id="treeContainer"
                style="display: none; padding: 5px; background: #fff; border: 1px solid #eee; min-height: 200px; overflow-y: auto;">
                <h4>מבנה האלמנטים ($`Body`$)</h4>
            </div>


            <div id="edit-panel"></div>


        </div>
    </div>

    <script src="./consts.js"></script>
    <script src="./servises.js"></script>
    <script src="./nav/nav_maneger.js"></script>
    <script src="./toolbar/toolbar_maneger.js"></script>
    <script src="./panels/tree/tree_maneger.js"></script>
    <script src="./panels/colors_and_fonts/design_maneger.js"></script>
    <script src="./panels/borders/borders_maneger.js"></script>
    <script src="./panels/view_and_position/view_maneger.js"></script>
    <script src="./panels/panel_maneger.js"></script>
    <script src="./listeners.js"></script>
    <script src="./script.js"></script>
    <script src="./maneger.js"></script>
</body>

</html>
