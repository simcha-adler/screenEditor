<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בנה את האתר שלך</title>
    <link rel="stylesheet" href="./styles/to order/panels_style.css">
    <link rel="stylesheet" href="./styles/orderCss/tree_style.css">
    <link rel="stylesheet" href="./styles/orderCss/app.css">
    <link rel="stylesheet" href="./styles/orderCss/panels.css">
    <link rel="stylesheet" href="./styles/orderCss/color picker.css">
    <link rel="stylesheet" href="./styles/orderCss/animation.css">
    <style id="styles"></style>
    <!-- <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="./lib/icons/RemixIcon_Fonts_v4.8.0/fonts/remixicon.css">
    <script src="./lib/short.js"></script>
    <script src="./lib/pickers/iro.js-master/iro.js-master/dist/iro.min.js"></script>


</head>

<body class="coloring">
    <header class="app-header">
        <div class="header-section">
            <div class="header-icon-btn" title="חזרה לבית"><i class="ri-home-4-line"></i></div>
            <div class="app-logo">SiteBuilder</div>
            <div id="picker"></div>
        </div>

        <div class="header-section center">
            <span class="file-name">my-website-project.html</span>
        </div>

        <div class="header-section">
            <div class="header-icon-btn" title="יציאה / ניתוק"><i class="ri-logout-box-r-line"></i></div>
            <div id="menu" class="header-icon-btn" title="תפריט"><i class="ri-menu-line"></i>
                <div class="dropdown-menu collapsed collapsedable">
                    <div class="dropdown-item" id="newDoc">מסמך חדש</div>
                    <div class="dropdown-item" id="upload">העלאת קובץ</div>
                    <input type="file" id="fileUploadInput" style="display: none;" accept=".html,.htm">
                    <div class="dropdown-item" id="saveDoc">שמור</div>
                    <div class="dropdown-item" id="downloadHTML">הורד כ-HTML</div>
                </div>
            </div>
            <div class="header-icon-btn toggle-edit-bar" id="btnToggleEditBar" title="הצג כלי עריכה">
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </div>
    </header>

    <div id="topBar" class="edit-actions-bar collapsed">
        <div class="action-group">
            <label class="action-toggle" title="אפשר הקלדה חופשית על הדף">
                <input type="checkbox" id="toggleContentEditable">
                <span><i class="ri-text"></i></span>
                <span>הקלדה חופשית</span>
            </label>
            <label class="action-toggle" title="אפשר גרירה ושחרור">
                <input type="checkbox" id="toggleDragDrop">
                <span><i class="ri-drag-move-2-line"></i></span>
                <span>גרירה</span>
            </label>
        </div>
        <div class="divider-vertical"></div>
        <div class="action-group">
            <span style="font-size:12px; color: var(--ui-25);">זום:</span>
            <input type="range" min="50" max="150" value="100" id="zoomRange" style="width:100px;">
            <span id="zoomValue" style="font-size:12px; width:35px;">100%</span>
        </div>
    </div>

    <div class="main-layout">

        <aside id="panel-right" class="panel-right">
            <div id="tree-header" class="tree-header">
                <h4 style="padding: 0; margin: 0;">מבנה המסמך</h4>
                <input type="checkbox" id="toggle-lock-drag" class="toggle-input">
                <label for="toggle-lock-drag" class="toggle-switch"></label>
            </div>
            <div id="panel-tree" class="tree-body"></div>
        </aside>

        <main class="workspace">
            <div class="width-screen">
                <div class="vp-btn active" data-width="100%" title="דסקטופ"><i class="ri-computer-line"></i></div>
                <div class="vp-btn" data-width="768px" title="טאבלט"><i class="ri-tablet-line"></i></div>
                <div class="vp-btn" data-width="375px" title="מובייל"><i class="ri-smartphone-line"></i></div>
            </div>

            <div id="canvas-scroller" class="canvas-scroller">
                <div id="דף_הבסיס" class="canvas"></div>
            </div>
        </main>

        <aside id="panel-left" class="panel-left">
            <div class="panel-header" id="panel-header">
                <div id="lockSelector" class="panel-header-content">
                    <label class="lockLabel" for="lock" style="cursor: pointer;">🔓</label>
                    <input type="checkbox" id="lock" class="hide">
                </div>
                <div id="selectedElement" class="panel-header-content">
                    <label for="theElement">אלמנט נבחר:</label>
                    <input type="text" id="theElement" placeholder="לא נבחר אלמנט" readonly>
                </div>

                <div id="edition-states" class="panel-header-content">
                    <label for="dropdown-states">מצב:</label>
                    <select id="dropdown-states">
                        <option value="">בסיסי</option>
                        <option value=":hover">מעבר עכבר</option>
                        <option value=":focus">פוקוס</option>
                        <option value=":active">לחיצה</option>
                        <option value=":first-child">ילד ראשון</option>
                        <option value=":last-child">ילד אחרון</option>
                        <option value=":nth-child(even)">ילדים זוגיים</option>
                        <option value=":nth-child(odd)">ילדים אי-זוגיים</option>
                        !--
                        <hr>
                        <option value="::before">לפני האלמנט</option>
                        <option value="::after">אחרי האלמנט</option>--
                    </select>
                </div>
            </div>

            <div id="panels">
                <div id="panel-add-element" class="panel"></div>
                <div id="panel-borders" class="panel"></div>
                <div id="panel-design" class="panel"></div>
                <div id="panel-layout" class="panel"></div>
                <div id="panel-position" class="panel"></div>
                <div id="panel-display" class="panel"></div>
                <div id="panel-classes" class="panel"></div>
                <div id="panel-theme" class="panel"></div>
                <div id="panel-settings" class="panel"></div>
                <div id="panel-animations" class="panel"></div>
            </div>
        </aside>

        <div id="sidebar" class="sidebar-icons"></div>
    </div>

    <div id="tree-menu" class="hide hidable">
        <div class="tree-menu-item not-for-editor" data-action='rename'><span>💫</span> החלף מזהה לאלמנט </div>
        <div class="tree-menu-item" data-action='diagnostic'><span>🚨</span> אבחן תקלות </div>
        <div class="tree-menu-item not-for-editor" data-action='duplicate'><span>📑</span> שכפל אלמנט</div>
        <div class="tree-menu-item not-for-editor" data-action='to-class'><span>🪄</span> הפוך עיצוב פרטי לקלאס</div>
        <div class="menu-hr not-for-editor"></div>
        <div class="tree-menu-item" data-action='add-inside'><span>↳</span> הוסף בתוך</div>
        <div class="tree-menu-item not-for-editor" data-action='add-after'><span>⬇</span> הוסף אחרי</div>
        <div class="menu-hr"></div>
        <div class="tree-menu-item not-for-editor" data-action='delete' style="color: red;"><span>🗑️</span> מחק
        </div>
        <div class="tree-menu-item" data-action='empty' style="color: red;"><span>🪫</span> רוקן תוכן</div>
    </div>

    <script src="./exampels/site.js"></script>
    <script src="./data_center.js"></script>
    <script type="module" src="./modules/styles.js"></script>
    <script type="module" src="./modules/selector.js"></script>
    <script type="module" src="./modules/edit.js"></script>
    <script src="./services.js"></script>
    <script src="./listeners.js"></script>
    <script src="./panels/nav.js"></script>
    <script src="./panels/sidebar.js"></script>
    <script src="./panels/components/inputs/colorPicker.js"></script>
    <script src="./panels/logic/addElement.js"></script>
    <script src="./panels/logic/classes.js"></script>
    <script src="./panels/logic/points.js"></script>
    <script type="module" src="./panels/logic/settings.js"></script>
    <script src="./panels/logic/theme.js"></script>
    <script type="module" src="./panels/tree/tree.js"></script>
    <script type="module" src="./panels/schemas/schemas.js"></script>
    <script type="module" src="./panels/components/base.js"></script>
    <script src="./manager.js"></script>
    <script src="./panels/topBar.js"></script>
    <script>var colos = new iro.ColorPicker('#דף_הבסיס');</script>
</body>

</html>
