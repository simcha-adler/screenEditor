<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עורך תוכן (דמוי אתר) - עם פאנלי עיצוב</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/nav_style.css">
    <link rel="stylesheet" href="./styles/toolbar_style.css">
    <link rel="stylesheet" href="./styles/sidebar_style.css">
    <link rel="stylesheet" href="./styles/tree_style.css">
    <link rel="stylesheet" href="./styles/panels_style.css">
    <style id="styles"></style>
    <script src="./lib/short.js"></script>
    <!--script src="./load.js"></script-->
</head>

<body>

    <div id="main-nav" class="main-nav"></div>
    <div id="toolbar" class="toolbar"></div>
    <div class="main-area">

        <div id="sidebar" class="sidebar"></div>
        <div id="panel-area" class="panel-area">
            <div class="panel-header" id="panel-header">
                <div id="selectedElement" class="panel-header-content">
                    <label for="theElement">אלמנט נבחר:</label>
                    <input type="text" id="theElement" placeholder="לא נבחר אלמנט" readonly>
                </div>

                <div id="edition-states" class="panel-header-content">
                    <label for="dropdown-states">מצב:</label>
                    <select id="dropdown-states">
                        <option value="">בסיסי</option>
                        <option value=":hover">מעבר עכבר</option>
                        <option value=":focus">פוקוס</option>
                        <option value=":active">לחיצה</option>
                        <option value=":first-child">ילד ראשון</option>
                        <option value=":last-child">ילד אחרון</option>
                        <option value=":nth-child(even)">ילדים זוגיים</option>
                        <option value=":nth-child(odd)">ילדים אי-זוגיים</option>
                        <!--hr>
                        <option value="::before">לפני האלמנט</option>
                        <option value="::after">אחרי האלמנט</option-->
                    </select>
                </div>
            </div>

            <div id="panels">
                <div id="panel-add-element" class="design-panel"></div>
                <div id="panel-borders" class="design-panel"></div>
                <div id="panel-design" class="design-panel"></div>
                <div id="panel-layout" class="design-panel"></div>
                <div id="panel-position" class="design-panel"></div>
                <div id="panel-display" class="design-panel"></div>
                <div id="panel-classes" class="design-panel"></div>

                <div id="panel-tree" class="design-panel">
                    <div id="tree-header" class="tree-header">
                        <h4 style="padding: 0; margin: 0;">מבנה המסמך</h4>
                        <input type="checkbox" id="toggle-lock-drag" class="toggle-input">
                        <label for="toggle-lock-drag" class="toggle-switch"></label>
                    </div>
                    <div id="tree-body" class="tree-body" style="margin: 0; padding: 0;"></div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="editor-view">
                <div id="editor-downloader" class="editor-downloader">
                    <div id="דף_הבסיס" class="document-page" contenteditable="true" spellcheck="false">
                        <h1 id="כותרת_לדוגמא">כותרת האתר שלך</h1>
                        <p id="פסקה_לדוגמא_1">כעת תפריט "עיצוב" פותח הגדרות מתקדמות בסרגל הצד.</p>
                        <hr>
                        <p id="פסקה_לדוגמא_2">נסו לבחור טקסט ולפתוח את פאנל "צבעים וגופנים" בתפריט עיצוב.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tree-menu">
        <div class="tree-menu-item not-for-editor" data-action='duplicate'><span>📑</span> שכפל אלמנט</div>
        <div class="menu-hr not-for-editor"></div>
        <div class="tree-menu-item" data-action='add-inside'><span>↳</span> הוסף בתוך</div>
        <div class="tree-menu-item not-for-editor" data-action='add-after'><span>⬇</span> הוסף אחרי</div>
        <div class="menu-hr"></div>
        <div class="tree-menu-item not-for-editor" data-action='delete' style="color: red;"><span>🗑️</span> מחק</div>
        <div class="tree-menu-item" data-action='empty' style="color: red;"><span>🗑️</span> רוקן תוכן</div>
    </div>

    <script src="./data_center.js"></script>
    <script src="./services.js"></script>
    <script src="./panels/nav.js"></script>
    <script src="./panels/toolbar.js"></script>
    <script src="./panels/sidebar.js"></script>
    <script src="./panels/tree.js"></script>
    <script src="./panels/side/design.js"></script>
    <script src="./panels/side/borders.js"></script>
    <script src="./panels/side/view.js"></script>
    <script src="./panels/side/layout.js"></script>
    <script src="./panels/side/position.js"></script>
    <script src="./panels/side/addElement.js"></script>
    <script src="./panels/side/classes.js"></script>
    <script src="./listeners.js"></script>
    <script src="./manager.js"></script>
</body>

</html>
